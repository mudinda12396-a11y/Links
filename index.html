<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudinda's Hub | Roblox & Gaming</title>
    
    <!-- NO GOOGLE FONTS NEEDED ANYMORE SINCE WE USE IMG TAGS -->
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; overflow-x: hidden; }
        .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); border: 1px solid rgba(255, 255, 255, 0.18); max-width: 400px; width: 90%; animation: fadeIn 1s ease-in-out; }
        
        /* PFP STYLE */
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #6d4aff;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid white;
            box-shadow: 0 0 20px rgba(109, 76, 255, 0.6);
            overflow: hidden;
        }
        
        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { font-size: 2rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        p { font-size: 1rem; opacity: 0.8; margin-bottom: 30px; }
        .links { display: flex; flex-direction: column; gap: 15px; }
        .link-btn { display: flex; align-items: center; justify-content: center; text-decoration: none; background: rgba(255, 255, 255, 0.15); color: white; padding: 15px; border-radius: 12px; transition: all 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.2); font-weight: bold; font-size: 1.1rem; position: relative; overflow: hidden; }
        .link-btn:hover { background: #6d4aff; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(109, 76, 255, 0.4); border-color: #fff; }
        
        /* UPDATED ICON STYLE FOR IMAGES */
        .icon-img {
            width: 24px; /* Size of the logo icons */
            height: 24px;
            margin-right: 12px;
            object-fit: contain;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .footer { margin-top: 30px; font-size: 0.8rem; opacity: 0.6; }
    </style>
</head>

    <div class="container">
